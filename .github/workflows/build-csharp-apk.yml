                      };
                      AddBody(saturn, solar);
                      orbiting.Add(saturn);

                      var mars = new CosmicBody
                      {
                          Id = "mars",
                          Name = "Mars",
                          Description = "Red terrestrial planet",
                          Tier = CosmicTier.Planet,
                          Radius = 0.65f,
                          OrbitRadius = 16,
                          OrbitSpeed = 0.35f,
                          Angle = 2.2f,
                          Primary = new Color(0.8f, 0.2f, 0.1f),
                          Secondary = new Color(0.9f, 0.5f, 0.3f),
                          Telemetry = "MARS\nDiameter: 6,779 km\nThe Red Planet"
                      };
                      AddBody(mars, solar);
                      orbiting.Add(mars);

                      var jupiter = new CosmicBody
                      {
                          Id = "jupiter",
                          Name = "Jupiter",
                          Description = "Largest gas giant",
                          Tier = CosmicTier.Planet,
                          Radius = 1.8f,
                          OrbitRadius = 29,
                          OrbitSpeed = 0.12f,
                          Angle = 3.5f,
                          Primary = new Color(0.75f, 0.5f, 0.3f),
                          Secondary = new Color(0.95f, 0.8f, 0.6f),
