​private void RefreshHudUI()
{
if (_focusedNode == null) return;
_tierBadgeLabel.Text = $"TINYVERSE C# (.NET 8) • {_focusedNode.Tier.ToString().ToUpper()}";
_telemetryTitleLabel.Text = $"{_focusedNode.Name}\n({_focusedNode.Subtitle})";
_telemetryBodyLabel.Text = _focusedNode.TelemetrySummary;
​foreach (Node child in _outlinerListContainer.GetChildren()) child.QueueFree();
​var listSource = _focusedNode.Children.Count > 0
? _focusedNode.Children
: (_focusedNode.Parent != null ? _focusedNode.Parent.Children : _rootNode.Children);
​foreach (var item in listSource)
{
var btn = new Button { Text = $"➔ {item.Name}", Alignment = HorizontalAlignment.Left };
var captured = item;
btn.Pressed += () => FocusOnBody(captured);
_outlinerListContainer.AddChild(btn);
}
​if (_focusedNode.Tier == CosmicTier.Planet)
{
var surfBtn = new Button { Text = "🛰️ Land on Surface" };
surfBtn.Pressed += () =>
{
_surfaceLayer.Visible = true;
_systemLayer.Visible = false;
_targetCamRadius = 8.0;
_tierBadgeLabel.Text = "TINYVERSE C# (.NET 8) • PLANETARY SURFACE";
};
_outlinerListContainer.AddChild(surfBtn);
}
}
}
}
EOF
​- name: 6. Download Godot 4.3 .NET (C#) Compiler & Android Export Templates
run: |
wget -q https://github.com/godotengine/godot/releases/download/{GODOT_VERSION}-stable/Godot_v{GODOT_VERSION}-stable_mono_linux_x86_64.zip
wget -q https://github.com/godotengine/godot/releases/download/{GODOT_VERSION}-stable/Godot_v{GODOT_VERSION}-stable_mono_export_templates.tpz
unzip -q Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
mkdir -p ~/.local/share/godot/export_templates/{GODOT_VERSION}.stable.mono
unzip -q Godot_v{GODOT_VERSION}-stable_mono_export_templates.tpz -d ~/.local/share/godot/export_templates/{GODOT_VERSION}.stable.mono
mv ~/.local/share/godot/export_templates/{GODOT_VERSION}.stable.mono/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/
​- name: 7. Configure Android Keystore & SDK in Both Export Presets and Editor Settings
run: |
keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
sed -i "s|custom_template/debug=""|custom_template/debug=""\nkeystore/debug="$PWD/debug.keystore"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"|g" export_presets.cfg
mkdir -p ~/.config/godot
cat << EOF > ~/.config/godot/editor_settings-4.tres
[gd_resource type="EditorSettings" format=3]
[resource]
export/android/android_sdk_path = "$SDK_DIR"
export/android/debug_keystore = "$PWD/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres
​- name: 8. Compile C# (.NET 8) & Package Native ARM64 Android APK
run: |
dotnet build TinyverseCSharp.csproj -c Debug
dotnet build TinyverseCSharp.csproj -c ExportDebug
./Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 --headless --export-debug "Android" build/Tinyverse-CSharp-ARM64.apk
ls -lh build/Tinyverse-CSharp-ARM64.apk
​- name: 9. Upload Compiled C# Android APK Artifact
uses: actions/upload-artifact@v4
with:
name: Tinyverse-Pure-CSharp-Android-APK
path: build/Tinyverse-CSharp-ARM64.apk
retention-days: 90
