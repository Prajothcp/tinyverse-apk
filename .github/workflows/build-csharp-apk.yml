name: Build Pure C# Tinyverse Android APK (.NET 8 + Godot 4 C#)
​on:
push:
branches: [ "main", "master" ]
workflow_dispatch:
​env:
GODOT_VERSION: "4.3"
​jobs:
compile-csharp-apk:
name: Compile C# (.NET 8) to Native Android ARM64 APK
runs-on: ubuntu-latest
​steps:
- name: 1. Checkout C# Repository
uses: actions/checkout@v4
​- name: 2. Install Microsoft .NET 8.0 C# SDK
uses: actions/setup-dotnet@v4
with:
dotnet-version: '8.0.x'
​- name: 3. Install JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: 4. Auto-Setup All C# Project Files (Self-Contained)
run: |
mkdir -p Scripts/Core build
​cat << 'EOF' > TinyverseCSharp.csproj
<Project Sdk="Godot.NET.Sdk/4.3.0">
<PropertyGroup>
<TargetFramework>net8.0</TargetFramework>
<EnableDynamicLoading>true</EnableDynamicLoading>
<Nullable>disable</Nullable>
<AllowUnsafeBlocks>true</AllowUnsafeBlocks>
<Optimize>true</Optimize>
</PropertyGroup>
</Project>
EOF
​cat << 'EOF' > project.godot
config_version=5
​[application]
config/name="Tinyverse C# Cosmos Simulator"
run/main_scene="res://MainCosmos.tscn"
config/features=PackedStringArray("4.3", "C#", "Mobile")
​[display]
window/size/viewport_width=1920
window/size/viewport_height=1080
window/stretch/mode="canvas_items"
window/stretch/aspect="expand"
window/handheld/orientation=4
​[dotnet]
project/assembly_name="TinyverseCSharp"
​[input_devices]
pointing/emulate_touch_from_mouse=true
​[rendering]
renderer/rendering_method="mobile"
anti_aliasing/quality/msaa_3d=2
EOF
​cat << 'EOF' > MainCosmos.tscn
[gd_scene load_steps=2 format=3 uid="uid://tinyverse_csharp_main"]
​[ext_resource type="Script" path="res://Scripts/Core/TinyverseCSharpMain.cs" id="1_csmain"]
​[node name="TinyverseRoot" type="Node3D"]
script = ExtResource("1_csmain")
EOF
​cat << 'EOF' > export_presets.cfg
[preset.0]
name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/Tinyverse-CSharp-ARM64.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
​[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.tinyverse.csharpcosmos"
package/name="Tinyverse C#"
package/signed=true
xr_features/xr_mode=0
screen/immersive_mode=true
EOF
​- name: 5. Generate C# 64-Bit Cosmic Engine Source Files
run: |
cat << 'EOF' > Scripts/Core/Vector3d.cs
using System;
using Godot;
​namespace TinyverseCSharp.Core
{
public struct Vector3d
{
public double X;
public double Y;
public double Z;
​public Vector3d(double x, double y, double z)
{
X = x;
Y = y;
Z = z;
}
​public static Vector3d Zero => new Vector3d(0, 0, 0);
public double Length => Math.Sqrt(X * X + Y * Y + Z * Z);
public Vector3 ToVector3() => new Vector3((float)X, (float)Y, (float)Z);
​public static Vector3d Lerp(Vector3d a, Vector3d b, double t)
{
t = Math.Clamp(t, 0.0, 1.0);
return new Vector3d(
a.X + (b.X - a.X) * t,
a.Y + (b.Y - a.Y) * t,
a.Z + (b.Z - a.Z) * t
);
}
​public static Vector3d operator +(Vector3d a, Vector3d b) => new Vector3d(a.X + b.X, a.Y + b.Y, a.Z + b.Z);
public static Vector3d operator -(Vector3d a, Vector3d b) => new Vector3d(a.X - b.X, a.Y - b.Y, a.Z - b.Z);
public static Vector3d operator *(Vector3d a, double s) => new Vector3d(a.X * s, a.Y * s, a.Z * s);
}
}
EOF
