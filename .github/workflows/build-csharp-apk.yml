
name: Build Tinyverse CSharp Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Build Tinyverse Android ARM64 APK
    runs-on: ubuntu-latest

    steps:
      # 1. Prepare environment
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      # 2. Create project directories
      - name: Generate Tinyverse project
        shell: bash
        run: |
          mkdir -p Scripts/Core build

          # Generate C# project
          cat > TinyverseCSharp.csproj <<'EOF'
          <Project Sdk="Godot.NET.Sdk/4.3.0">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <EnableDynamicLoading>true</EnableDynamicLoading>
              <Nullable>disable</Nullable>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <Optimize>true</Optimize>
            </PropertyGroup>
          </Project>
          EOF

          # Generate Godot project
          cat > project.godot <<'EOF'
          config_version=5

          [application]
          config/name="TINYVERSE - Cosmic Simulator"
          run/main_scene="res://MainCosmos.tscn"
          config/features=PackedStringArray("4.3", "C#", "Mobile")

          [display]
          window/size/viewport_width=1920
          window/size/viewport_height=1080
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"
          window/handheld/orientation=0

          [dotnet]
          project/assembly_name="TinyverseCSharp"

          [input_devices]
          pointing/emulate_touch_from_mouse=true

          [rendering]
          renderer/rendering_method="mobile"
          renderer/rendering_method.mobile="mobile"
          environment/defaults/default_clear_color=Color(0.008,0.015,0.04,1)
          anti_aliasing/quality/msaa_3d=2
          EOF

          # Generate main scene
          cat > MainCosmos.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://Scripts/Core/TinyverseCSharpMain.cs" id="1"]

          [node name="TinyverseRoot" type="Node3D"]
          script = ExtResource("1")
          EOF

          # Generate Android export preset
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Tinyverse-ARM64.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.tinyverse.cosmos"
          package/name="Tinyverse"
          package/signed=true
          package/version_code=1
          package/version_name="1.0"
          screen/immersive_mode=true
          screen/orientation=0
          permissions/internet=true
          EOF

      # 3. Generate 64-bit vector mathematics
      - name: Generate Vector3d
        run: |
          cat > Scripts/Core/Vector3d.cs <<'EOF'
          using System;
          using Godot;

          namespace TinyverseCSharp.Core
          {
              public struct Vector3d
              {
                  public double X, Y, Z;

                  public Vector3d(double x, double y, double z)
                  {
                      X = x;
                      Y = y;
                      Z = z;
                  }

                  public static Vector3d Zero => new Vector3d(0, 0, 0);

                  public double Length =>
                      Math.Sqrt(X * X + Y * Y + Z * Z);

                  public Vector3 ToVector3() =>
                      new Vector3((float)X, (float)Y, (float)Z);

                  public static Vector3d Lerp(Vector3d a, Vector3d b, double t)
                  {
                      t = Math.Clamp(t, 0, 1);
                      return new Vector3d(
                          a.X + (b.X - a.X) * t,
                          a.Y + (b.Y - a.Y) * t,
                          a.Z + (b.Z - a.Z) * t
                      );
                  }

                  public static Vector3d operator +(Vector3d a, Vector3d b) =>
                      new Vector3d(a.X + b.X, a.Y + b.Y, a.Z + b.Z);

                  public static Vector3d operator -(Vector3d a, Vector3d b) =>
                      new Vector3d(a.X - b.X, a.Y - b.Y, a.Z - b.Z);

                  public static Vector3d operator *(Vector3d a, double s) =>
                      new Vector3d(a.X * s, a.Y * s, a.Z * s);
              }
          }
          EOF

      # 4. Generate the complete cosmic simulation
      - name: Generate Tinyverse CSharp engine
        run: |
          cat > Scripts/Core/TinyverseCSharpMain.cs <<'EOF'
          using System;
          using System.Collections.Generic;
          using Godot;

          namespace TinyverseCSharp.Core
          {
              public partial class TinyverseCSharpMain : Node3D
              {
