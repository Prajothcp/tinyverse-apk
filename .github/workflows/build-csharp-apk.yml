                      AddBody(jupiter, solar);
                      orbiting.Add(jupiter);
                  }

                  private MeshInstance3D Sphere(float radius, Color color, bool glow)
                  {
                      var mesh = new MeshInstance3D
                      {
                          Mesh = new SphereMesh
                          {
                              Radius = radius,
                              Height = radius * 2,
                              RadialSegments = 24,
                              Rings = 16
                          }
                      };

                      var material = new StandardMaterial3D
                      {
                          AlbedoColor = color,
                          Roughness = 0.6f,
                          EmissionEnabled = glow,
                          Emission = color,
                          EmissionEnergyMultiplier = glow ? 2.0f : 0.0f
                      };

                      mesh.MaterialOverride = material;
                      return mesh;
                  }

                  private Node3D GlowingSphere(float radius, Color color)
                  {
                      var node = new Node3D();
                      node.AddChild(Sphere(radius, color, true));
                      return node;
                  }

                  private Node3D BlackHole(float radius)
                  {
                      var node = new Node3D();

                      var horizon = Sphere(radius, Colors.Black, false);
                      horizon.MaterialOverride = new StandardMaterial3D
                      {
                          ShadingMode = BaseMaterial3D.ShadingModeEnum.Unshaded,
                          AlbedoColor = Colors.Black
                      };
                      node.AddChild(horizon);

                      var disk = new MeshInstance3D
                      {
                          Mesh = new TorusMesh
                          {
                              InnerRadius = radius * 1.35f,
                              OuterRadius = radius * 4.2f
                          },
                          Scale = new Vector3(1, 0.09f, 1)
                      };

                      disk.MaterialOverride = new StandardMaterial3D
                      {
                          AlbedoColor = new Color(1, 0.45f, 0.1f),
                          EmissionEnabled = true,
                          Emission = new Color(1, 0.3f, 0.05f),
                          EmissionEnergyMultiplier = 3
                      };

                      node.AddChild(disk);
                      return node;
                  }

                  private Node3D GenerateGalaxy(CosmicBody body, int count)
                  {
                      var container = new Node3D();
                      var instance = new MultiMeshInstance3D();

                      var multi = new MultiMesh
                      {
                          TransformFormat = MultiMesh.TransformFormatEnum.Transform3D,
                          UseColors = true,
                          InstanceCount = count,
                          Mesh = new SphereMesh
                          {
                              Radius = 0.08f,
                              Height = 0.16f,
                              RadialSegments = 4,
                              Rings = 2
                          }
                      };

                      instance.MaterialOverride = new StandardMaterial3D
                      {
                          ShadingMode = BaseMaterial3D.ShadingModeEnum.Unshaded,
                          VertexColorUseAsAlbedo = true
                      };

                      var random = new Random(body.Id.GetHashCode());

                      for (int i = 0; i < count; i++)
                      {
                          float rNorm = Mathf.Pow((float)random.NextDouble(), 1.35f);
                          float r = rNorm * body.Radius;

                          float arm = (i % 4) * Mathf.Pi * 0.5f;
                          float angle = arm + r * 0.26f +
                              ((float)random.NextDouble() - 0.5f) * 0.65f;

                          float y = ((float)random.NextDouble() - 0.5f) *
                              (1 - rNorm * 0.75f) * body.Radius * 0.14f;

                          var position = new Vector3(
                              Mathf.Cos(angle) * r,
                              y,
                              Mathf.Sin(angle) * r
                          );

                          multi.SetInstanceTransform(
                              i,
                              new Transform3D(Basis.Identity, position)
                          );

                          multi.SetInstanceColor(
                              i,
                              body.Secondary.Lerp(body.Primary, rNorm)
                          );
                      }

                      instance.Multimesh = multi;
                      container.AddChild(instance);
                      return container;
                  }

                  private void CreateCosmos()
                  {
                      foreach (var universe in root.Children)
                      {
                          var visual = GlowingSphere(
                              universe.Radius,
                              universe.Primary
                          );
                          visual.Position = universe.Position.ToVector3();
                          multiverseLayer.AddChild(visual);
                          universe.Visual = visual;
                      }

                      var alpha = bodies["alpha"];

                      foreach (var galaxy in alpha.Children)
                      {
                          var visual = GenerateGalaxy(galaxy, 12000);
                          visual.Position = galaxy.Position.ToVector3();
                          universeLayer.AddChild(visual);
                          galaxy.Visual = visual;
                      }

                      var mw = bodies["milkyway"];

                      galaxyLayer.AddChild(GenerateGalaxy(mw, 18000));

                      foreach (var item in mw.Children)
                      {
                          Node3D visual;

                          if (item.Tier == CosmicTier.BlackHole)
                              visual = BlackHole(item.Radius);
                          else
                              visual = GlowingSphere(item.Radius, item.Primary);

                          visual.Position = item.Position.ToVector3();
                          galaxyLayer.AddChild(visual);
                          item.Visual = visual;
                      }

                      var sun = bodies["solar"];
                      var sunVisual = GlowingSphere(sun.Radius, sun.Primary);
                      systemLayer.AddChild(sunVisual);
                      sun.Visual = sunVisual;

                      foreach (var planet in sun.Children)
                      {
                          var group = new Node3D();
                          group.AddChild(Sphere(planet.Radius, planet.Primary, false));

                          systemLayer.AddChild(group);
                          planet.Visual = group;
                      }

                      var ground = new MeshInstance3D
                      {
                          Mesh = new PlaneMesh
                          {
                              Size = new Vector2(180, 180),
                              SubdivideWidth = 64,
                              SubdivideDepth = 64
                          }
                      };

                      ground.MaterialOverride = new StandardMaterial3D
                      {
                          AlbedoColor = new Color(0.08f, 0.4f, 0.2f)
                      };

                      surfaceLayer.AddChild(ground);
                  }

                  public void Focus(CosmicBody body, double? zoom = null)
                  {
                      if (body == null)
                          return;

                      focused = body;

                      multiverseLayer.Visible = body.Tier == CosmicTier.Multiverse;
                      universeLayer.Visible = body.Tier == CosmicTier.Universe;
                      galaxyLayer.Visible = body.Tier == CosmicTier.Galaxy ||
                          body.Tier == CosmicTier.BlackHole;
                      systemLayer.Visible = body.Tier == CosmicTier.StarSystem ||
                          body.Tier == CosmicTier.Planet;
                      surfaceLayer.Visible = body.Tier == CosmicTier.PlanetarySurface;

                      if (body.Tier == CosmicTier.Multiverse ||
                          body.Tier == CosmicTier.Universe)
                          target = body.Position;
                      else if (body.Tier == CosmicTier.Planet && body.Visual != null)
                      {
                          Vector3 p = body.Visual.Position;
                          target = new Vector3d(p.X, p.Y, p.Z);
                      }
                      else
                          target = Vector3d.Zero;

                      targetDistance = zoom ?? body.Tier switch
                      {
                          CosmicTier.Multiverse => 680,
                          CosmicTier.Universe => 140,
                          CosmicTier.Galaxy => 50,
                          CosmicTier.StarSystem => 36,
                          CosmicTier.BlackHole => 12,
                          CosmicTier.Planet => 3.5,
                          CosmicTier.PlanetarySurface => 8,
                          _ => 50
                      };

                      UpdateInterface();
                  }

                  private void CreateInterface()
                  {
                      var canvas = new CanvasLayer();
                      AddChild(canvas);

                      var top = new PanelContainer
                      {
                          AnchorRight = 1,
                          OffsetLeft = 12,
                          OffsetTop = 10,
                          OffsetRight = -12,
                          OffsetBottom = 54
                      };
                      canvas.AddChild(top);

                      tierLabel = new Label
                      {
                          Text = "TINYVERSE  |  MULTIVERSE"
                      };
                      top.AddChild(tierLabel);

                      var left = new PanelContainer
                      {
                          AnchorBottom = 1,
                          OffsetLeft = 12,
                          OffsetTop = 65,
                          OffsetRight = 285,
                          OffsetBottom = -65
                      };
                      canvas.AddChild(left);

                      var scroll = new ScrollContainer();
                      left.AddChild(scroll);

                      list = new VBoxContainer
                      {
                          SizeFlagsHorizontal = Control.SizeFlags.ExpandFill
                      };
                      scroll.AddChild(list);

                      var right = new PanelContainer
                      {
                          AnchorLeft = 1,
                          AnchorRight = 1,
                          AnchorBottom = 1,
                          OffsetLeft = -310,
                          OffsetTop = 65,
                          OffsetRight = -12,
                          OffsetBottom = -65
                      };
                      canvas.AddChild(right);

                      var info = new VBoxContainer();
                      right.AddChild(info);

                      titleLabel = new Label
                      {
                          Text = "Cosmic Telemetry",
                          AutowrapMode = TextServer.AutowrapMode.WordSmart
                      };

                      infoLabel = new Label
                      {
                          Text = "",
                          AutowrapMode = TextServer.AutowrapMode.WordSmart
                      };

                      info.AddChild(titleLabel);
                      info.AddChild(infoLabel);

                      var bottom = new PanelContainer
                      {
                          AnchorTop = 1,
                          AnchorRight = 1,
                          AnchorBottom = 1,
                          OffsetLeft = 12,
                          OffsetTop = -55,
                          OffsetRight = -12,
                          OffsetBottom = -10
                      };
                      canvas.AddChild(bottom);

                      var row = new HBoxContainer();
                      bottom.AddChild(row);

                      var zoomIn = new Button { Text = "+ Zoom" };
                      zoomIn.Pressed += () =>
                          targetDistance = Math.Max(0.5, targetDistance * 0.7);
                      row.AddChild(zoomIn);

                      var zoomOut = new Button { Text = "- Zoom" };
                      zoomOut.Pressed += () =>
                          targetDistance = Math.Min(2200, targetDistance * 1.4);
                      row.AddChild(zoomOut);

                      var parent = new Button { Text = "↑ Parent" };
                      parent.Pressed += () =>
                      {
                          if (focused?.Parent != null)
                              Focus(focused.Parent);
                      };
                      row.AddChild(parent);

                      pauseButton = new Button { Text = "II Pause" };
                      pauseButton.Pressed += () =>
                      {
                          running = !running;
                          pauseButton.Text = running ? "II Pause" : "▶ Play";
                      };
                      row.AddChild(pauseButton);
                  }

                  private void UpdateInterface()
                  {
                      if (focused == null)
                          return;

                      tierLabel.Text = "TINYVERSE  |  " +
                          focused.Tier.ToString().ToUpperInvariant();

                      titleLabel.Text = focused.Name +
                          "\n" + focused.Description;

                      infoLabel.Text = focused.Telemetry;

                      foreach (Node child in list.GetChildren())
                          child.QueueFree();

                      var source = focused.Children.Count > 0
                          ? focused.Children
                          : focused.Parent != null
                              ? focused.Parent.Children
                              : root.Children;

                      foreach (var body in source)
                      {
                          var button = new Button
                          {
                              Text = "➜ " + body.Name,
                              Alignment = HorizontalAlignment.Left
                          };

                          var captured = body;
                          button.Pressed += () => Focus(captured);
                          list.AddChild(button);
                      }

                      if (focused.Tier == CosmicTier.Planet)
                      {
                          var land = new Button
                          {
                              Text = "Land on Planet Surface"
                          };

                          land.Pressed += () =>
                          {
                              surfaceLayer.Visible = true;
                              systemLayer.Visible = false;
                              focused = new CosmicBody
                              {
                                  Name = focused.Name + " Surface",
                                  Description = "Planetary surface view",
                                  Tier = CosmicTier.PlanetarySurface,
                                  Telemetry = "SURFACE EXPLORATION\nTerrain visualization"
                              };
                              target = Vector3d.Zero;
                              targetDistance = 8;
                              UpdateInterface();
                          };

                          list.AddChild(land);
                      }
                  }

                  public override void _Input(InputEvent e)
                  {
                      if (e is InputEventScreenTouch touch)
                      {
                          if (touch.Pressed)
                              touches[touch.Index] = touch.Position;
                          else
                              touches.Remove(touch.Index);

                          lastPinch = 0;
                      }
                      else if (e is InputEventScreenDrag drag)
                      {
                          touches[drag.Index] = drag.Position;

                          if (touches.Count == 1)
                          {
                              targetTheta -= drag.Relative.X * 0.006f;
                              targetPhi = Mathf.Clamp(
                                  targetPhi - drag.Relative.Y * 0.006f,
                                  0.12f,
                                  Mathf.Pi - 0.12f
                              );
                          }
                          else if (touches.Count >= 2)
                          {
                              var points = new List<Vector2>(touches.Values);
                              float d = points[0].DistanceTo(points[1]);

                              if (lastPinch > 5)
                                  targetDistance = Math.Clamp(
                                      targetDistance * lastPinch /
                                      Math.Max(10, d), 0.5, 2200
                                  );

                              lastPinch = d;
                          }
                      }
                      else if (e is InputEventMouseButton mouse)
                      {
                          if (mouse.ButtonIndex == MouseButton.Left)
                              dragging = mouse.Pressed;

                          if (mouse.Pressed &&
                              mouse.ButtonIndex == MouseButton.WheelUp)
                              targetDistance = Math.Max(0.5, targetDistance * 0.85);

                          if (mouse.Pressed &&
                              mouse.ButtonIndex == MouseButton.WheelDown)
                              targetDistance = Math.Min(2200, targetDistance * 1.18);
                      }
                      else if (e is InputEventMouseMotion motion && dragging)
                      {
                          targetTheta -= motion.Relative.X * 0.006f;
                          targetPhi = Mathf.Clamp(
                              targetPhi - motion.Relative.Y * 0.006f,
                              0.12f,
                              Mathf.Pi - 0.12f
                          );
                      }
                  }

                  public override void _Process(double delta)
                  {
                      float dt = (float)delta;

                      if (running)
                      {
                          foreach (var planet in orbiting)
                          {
                              planet.Angle += planet.OrbitSpeed * dt;

                              if (planet.Visual != null)
                              {
                                  planet.Visual.Position = new Vector3(
                                      Mathf.Cos(planet.Angle) * planet.OrbitRadius,
                                      0,
                                      Mathf.Sin(planet.Angle) * planet.OrbitRadius
                                  );
                              }
                          }
                      }

                      distance += (targetDistance - distance) *
                          Math.Min(1, delta * 8);

                      theta = Mathf.Lerp(theta, targetTheta, dt * 10);
                      phi = Mathf.Lerp(phi, targetPhi, dt * 10);

                      current = Vector3d.Lerp(current, target, delta * 10);

                      double sin = Math.Sin(phi);

                      Vector3d cameraPosition = current + new Vector3d(
                          distance * sin * Math.Sin(theta),
                          distance * Math.Cos(phi),
                          distance * sin * Math.Cos(theta)
                      );

                      camera.GlobalPosition = cameraPosition.ToVector3();
                      camera.LookAt(current.ToVector3(), Vector3.Up);
                  }
              }
          }
          EOF

      # 5. Download Godot 4.3 .NET editor and templates
      - name: Download Godot .NET
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"

          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"

          mkdir -p /tmp/godot-templates

          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" \
            -d /tmp/godot-templates

          mv /tmp/godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/"

      # 6. Create signing keystore and configure Godot
      - name: Configure Android signing
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          cat >> export_presets.cfg <<EOF
          keystore/debug="$GITHUB_WORKSPACE/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      # 7. Restore and compile C#
      - name: Restore and compile CSharp
        run: |
          dotnet restore TinyverseCSharp.csproj
          dotnet build TinyverseCSharp.csproj -c Debug --no-restore

      # 8. Import Godot project and export APK
      - name: Export Android ARM64 APK
        run: |
          GODOT="./Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"

          chmod +x "$GODOT"

          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --import

          "$GODOT" --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/Tinyverse-ARM64.apk"

          test -s build/Tinyverse-ARM64.apk
          ls -lh build/Tinyverse-ARM64.apk

      # 9. Upload APK
      - name: Upload Tinyverse APK
        uses: actions/upload-artifact@v4
        with:
          name: Tinyverse-Android-ARM64-APK
          path: build/Tinyverse-ARM64.apk
          if-no-files-found: error
          retention-days: 90
