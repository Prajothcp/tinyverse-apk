                      public float OrbitSpeed;
                      public float Angle;
                      public Color Primary = Colors.White;
                      public Color Secondary = Colors.White;
                      public string Telemetry = "";
                      public Node3D Visual;
                      public CosmicBody Parent;
                      public List<CosmicBody> Children = new();
                  }

                  private Camera3D camera;
                  private Node3D multiverseLayer;
                  private Node3D universeLayer;
                  private Node3D galaxyLayer;
                  private Node3D systemLayer;
                  private Node3D surfaceLayer;

                  private CosmicBody root;
                  private CosmicBody focused;

                  private readonly Dictionary<string, CosmicBody> bodies = new();
                  private readonly List<CosmicBody> orbiting = new();

                  private Vector3d target = Vector3d.Zero;
                  private Vector3d current = Vector3d.Zero;

                  private double distance = 680;
                  private double targetDistance = 680;

                  private float theta = 0.45f;
                  private float phi = 1.18f;
                  private float targetTheta = 0.45f;
                  private float targetPhi = 1.18f;

                  private bool running = true;
                  private bool dragging;
                  private float lastPinch;

                  private readonly Dictionary<int, Vector2> touches = new();

                  private Label titleLabel;
                  private Label infoLabel;
                  private Label tierLabel;
                  private VBoxContainer list;
                  private Button pauseButton;

                  public override void _Ready()
                  {
                      SetupScene();
                      CreateDatabase();
                      CreateCosmos();
                      CreateInterface();
                      Focus(root, 680);
                  }

                  private void SetupScene()
                  {
                      var environment = new WorldEnvironment();
                      environment.Environment = new Godot.Environment
                      {
                          BackgroundMode = Godot.Environment.BGMode.Color,
                          BackgroundColor = new Color(0.008f, 0.015f, 0.04f),
                          AmbientLightSource = Godot.Environment.AmbientSource.Color,
                          AmbientLightColor = new Color(0.3f, 0.35f, 0.5f),
                          AmbientLightEnergy = 1.0f
                      };
                      AddChild(environment);

                      camera = new Camera3D
                      {
                          Fov = 55,
                          Near = 0.05f,
                          Far = 8000
                      };
                      AddChild(camera);

                      var light = new DirectionalLight3D
                      {
                          LightEnergy = 2
                      };
                      light.RotationDegrees = new Vector3(-25, 35, 0);
                      AddChild(light);

                      multiverseLayer = new Node3D();
                      universeLayer = new Node3D();
                      galaxyLayer = new Node3D();
                      systemLayer = new Node3D();
                      surfaceLayer = new Node3D();

                      AddChild(multiverseLayer);
                      AddChild(universeLayer);
                      AddChild(galaxyLayer);
                      AddChild(systemLayer);
                      AddChild(surfaceLayer);
                  }

                  private void AddBody(CosmicBody body, CosmicBody parent)
                  {
                      body.Parent = parent;
                      parent?.Children.Add(body);
                      bodies[body.Id] = body;
                  }

